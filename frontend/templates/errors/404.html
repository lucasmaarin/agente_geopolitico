{% extends "base.html" %}

{% block title %}Página não encontrada - {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-question-circle display-1 text-warning"></i>
    <h1 class="mt-4">404</h1>
    <h4>Página não encontrada</h4>
    <p class="text-muted">A página que você está procurando não existe ou foi movida.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-2"></i>Voltar ao Início
    </a>
</div>
{% endblock %}
